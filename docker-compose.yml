services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-GaritaApp}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-garita_app}"
      DB_USERNAME: "${DB_USERNAME:-garita}"
      DB_PASSWORD: "${DB_PASSWORD:-garita_secret}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_secret}"
      BROADCAST_DRIVER: "${BROADCAST_DRIVER:-log}"
      CACHE_DRIVER: "${CACHE_DRIVER:-file}"
      FILESYSTEM_DRIVER: "${FILESYSTEM_DRIVER:-local}"
      IMAGE_STORAGE_DRIVER: "${IMAGE_STORAGE_DRIVER:-local}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
      MAIL_PORT: "${MAIL_PORT:-1025}"
      MAIL_USERNAME: "${MAIL_USERNAME:-null}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-null}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-null}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-GaritaApp}"
      GARITA_FOLDER: "${GARITA_FOLDER:-garita-001}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:-}"
      AWS_URL: "${AWS_URL:-}"
      AWS_ENDPOINT: "${AWS_ENDPOINT:-}"
      AWS_EC2_METADATA_DISABLED: "true"
      PUSHER_APP_ID: "${PUSHER_APP_ID:-}"
      PUSHER_APP_KEY: "${PUSHER_APP_KEY:-}"
      PUSHER_APP_SECRET: "${PUSHER_APP_SECRET:-}"
      PUSHER_APP_CLUSTER: "${PUSHER_APP_CLUSTER:-mt1}"
      MIX_PUSHER_APP_KEY: "${MIX_PUSHER_APP_KEY:-}"
      MIX_PUSHER_APP_CLUSTER: "${MIX_PUSHER_APP_CLUSTER:-mt1}"
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - app_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-garita_app}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_secret}"
      DB_USERNAME: "${DB_USERNAME:-garita}"
      DB_PASSWORD: "${DB_PASSWORD:-garita_secret}"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/000-create-app-user.sh:/docker-entrypoint-initdb.d/000-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  app_storage:
  app_cache:
  vendor:
