version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: garita_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: garitaapp
      MYSQL_USER: garita_user
      MYSQL_PASSWORD: garita_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - garita_network
    command: --default-authentication-plugin=mysql_native_password

  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garita_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:your-app-key-here
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=garitaapp
      - DB_USERNAME=garita_user
      - DB_PASSWORD=garita_password
      - APP_URL=http://localhost:8080
    depends_on:
      - mysql
    networks:
      - garita_network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: garita_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites/:/etc/nginx/sites-available/
      - ./docker/nginx/ssl/:/etc/ssl/certs/
    depends_on:
      - app
    networks:
      - garita_network

  # Redis (Optional - for caching and sessions)
  redis:
    image: redis:alpine
    container_name: garita_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - garita_network

  # PhpMyAdmin (Optional - for database management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: garita_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: garita_user
      PMA_PASSWORD: garita_password
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - garita_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  garita_network:
    driver: bridge