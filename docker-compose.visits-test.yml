# Standalone isolated instance. Never combines with docker-compose.yml or its .env.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: visits_test_only
      MYSQL_DATABASE: garita_visits_test
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pvisits_test_only --silent"]
      interval: 2s
      timeout: 2s
      retries: 60
  app:
    build: .
    image: garitaapp-visits-test
    entrypoint: ["/bin/sh", "/var/www/html/tests/docker/start-visits.sh"]
    environment:
      APP_NAME: GaritaVisitsTest
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      APP_URL: http://localhost:18880
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: garita_visits_test
      DB_USERNAME: root
      DB_PASSWORD: visits_test_only
      IMAGE_STORAGE_DRIVER: local
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      SESSION_COOKIE: garita_visits_test_session
      SESSION_LIFETIME: 120
      MAIL_MAILER: array
      LOG_CHANNEL: stack
    volumes:
      - ./:/var/www/html:ro
      - ./tests/docker/control-visits.php:/var/www/html/public/index.php:ro
      - ./tests/docker/testing.env:/var/www/html/.env:ro
      - test_storage:/var/www/html/storage
      - test_cache:/var/www/html/bootstrap/cache
      - test_vendor:/var/www/html/vendor
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      mysql:
        condition: service_healthy
  web:
    image: nginx:1.25-alpine
    ports:
      - "127.0.0.1:18880:80"
    volumes:
      - ./:/var/www/html:ro
      - ./tests/docker/control-visits.php:/var/www/html/public/index.php:ro
      - test_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
volumes:
  test_storage:
  test_cache:
  test_vendor:
